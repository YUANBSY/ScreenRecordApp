# GitHub Actions - 自动编译APK
#
# 使用最简单的方法

name: 编译APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 设置JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 编译APK
        uses: eskatos/gradle-command-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecord-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
