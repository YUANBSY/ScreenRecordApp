# Gradle Wrapper配置文件
#
# Gradle Wrapper是什么？
# 它是一个脚本，可以自动下载并使用正确版本的Gradle
# 这样即使电脑上没有安装Gradle，也能构建项目
#
# 好处：
# 1. 不需要手动安装Gradle
# 2. 确保所有开发者使用相同版本的Gradle
# 3. CI/CD环境自动配置

# Gradle版本号
# 使用8.5版本，与最新的Android Studio兼容
# 使用华为云镜像，加速下载
distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-8.5-bin.zip

# 下载Gradle的保存位置
# GRADLE_USER_HOME是Gradle的缓存目录
distributionPath=wrapper/dists

# ZIP文件保存位置
zipStorePath=wrapper/dists

# 下载超时时间（毫秒）
# 10分钟超时，适应较慢的网络环境
networkTimeout=600000
