# Gradle配置文件
#
# 这个文件配置Gradle构建工具本身的行为
# 例如：使用什么版本的Gradle、是否使用并行构建等

# Gradle守护进程配置
# 守护进程是一个后台进程，可以加速构建

# 使用并行构建
# 可以同时构建多个模块，加快构建速度
org.gradle.parallel=true

# 启用构建缓存
# 缓存构建结果，避免重复编译
org.gradle.caching=true

# 使用AndroidX
# AndroidX是Android支持库的新版本
# 所有支持库都迁移到了androidx包下
android.useAndroidX=true

# 启用非传递R类
# 每个模块只包含自己资源的R类，减小APK体积
android.nonTransitiveRClass=true

# JVM参数
# 增加JVM内存，避免构建时内存不足
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
